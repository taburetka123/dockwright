set  -g  default-terminal "tmux-256color"
set  -as terminal-features ",xterm-kitty:RGB"
set  -ga terminal-overrides ",xterm-256color:Tc"

set  -s  extended-keys always
set  -as terminal-features ",xterm*:extkeys"

set  -sg escape-time 10
set  -g  focus-events on
set  -g  set-clipboard on
set  -g  allow-passthrough on
setw -g  aggressive-resize on

set-environment -gu GH_TOKEN
set-environment -gu GITHUB_TOKEN
set-environment -gu DIRENV_DIFF
set-environment -gu DIRENV_DIR
set-environment -gu DIRENV_FILE
set-environment -gu DIRENV_WATCHES
%if "#{m:/*,{{tmux_path_prepend}}}"
%if "#{?#{m:{{tmux_path_prepend}}:*,$PATH},0,1}"
set-environment -g PATH "{{tmux_path_prepend}}:$PATH"
%endif
%endif

set  -g  mouse on
bind -T copy-mode    WheelUpPane   send -X -N 2 scroll-up
bind -T copy-mode    WheelDownPane send -X -N 2 scroll-down
bind -T copy-mode-vi WheelUpPane   send -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 2 scroll-down
unbind -n WheelUpStatus
unbind -n WheelDownStatus

bind j display-popup -E -w 60% -h 50% \
  "tmux list-sessions -F '#{session_name}' | \
   fzf --reverse --prompt 'session> ' --header 'attach session' | \
   xargs -r tmux switch-client -t"

bind w choose-tree -Zw

if -F '#{==:#{status},on}' 'set -g status 2'
set  -g  status-interval 5
set  -g  status-style "bg=#1c1c1c,fg=#bbbbbb"
set  -g  'status-format[0]' "#[align=left]#(python3 $HOME/.claude/dockwright/status_row.py line 0 #{pane_id} #{client_width})#[align=right] %H:%M "
set  -g  'status-format[1]' "#[align=left]#(python3 $HOME/.claude/dockwright/status_row.py line 1 #{pane_id} #{client_width})"
set  -g  'status-format[2]' "#[align=left]#(python3 $HOME/.claude/dockwright/status_row.py line 2 #{pane_id} #{client_width})"
set  -g  'status-format[3]' "#[align=left]#(python3 $HOME/.claude/dockwright/status_row.py line 3 #{pane_id} #{client_width})"
set  -g  'status-format[4]' "#[align=left]#(python3 $HOME/.claude/dockwright/status_row.py line 4 #{pane_id} #{client_width})"

unbind -n MouseDown1Status
bind -n MouseUp1Status run-shell 'python3 $HOME/.claude/dockwright/status_row.py click "#{mouse_status_range}" "#{client_name}" "#{mouse_x}" "#{pane_id}" "#{client_height}"'

set  -g  window-status-format         " #I:#W "
set  -g  window-status-current-format " #I:#W "
set  -g  window-status-style          "bg=#303030,fg=#bbbbbb"
set  -g  window-status-current-style  "bg=#505050,fg=#ffffff"
